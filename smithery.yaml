# Smithery configuration file
$schema: https://smithery.ai/smithery.config.schema.json
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - UNIFI_HOST
      - UNIFI_API_KEY
    properties:
      UNIFI_HOST:
        type: string
        description: "The IP or hostname of your UniFi OS console (e.g., https://192.168.1.1)"
      UNIFI_API_KEY:
        type: string
        description: "Your UniFi Local API Key generated from UDM Control Plane -> Integrations"
  command: node
  args:
    - index.js
  env:
    UNIFI_HOST: "{{UNIFI_HOST}}"
    UNIFI_API_KEY: "{{UNIFI_API_KEY}}"
